<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="home-container">
        <header class="home-header">
            <h1 class="home-title">
                <i class="fas fa-th-large"></i>
                My Apps
            </h1>
            <p class="home-subtitle">Choose an application to get started</p>
        </header>

        <div class="app-cards">
            <a href="todo.html" class="app-card todo-card">
                <div class="card-icon">
                    <i class="fas fa-check-square"></i>
                </div>
                <div class="card-content">
                    <h2>To-Do List</h2>
                    <p>Organize your tasks and stay productive</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <a href="finance.html" class="app-card finance-card">
                <div class="card-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="card-content">
                    <h2>Finance Tracker</h2>
                    <p>Manage your money and track expenses</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </div>

        <footer class="home-footer">
            <p>Copyright dansoy</p>
        </footer>
    </div>
</body>
</html>
